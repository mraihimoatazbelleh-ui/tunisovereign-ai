services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tunisovereign_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tunisovereign_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  anvil-blockchain:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--block-time", "2"]
    ports:
      - "8545:8545"

  migrate:
    build: .
    command: ["sh", "-c", "python backend/manage.py migrate && python backend/manage.py seed_demo"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  grpc:
    build: .
    command: python grpc_service/server.py
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      GRPC_PORT: "50051"
      PYTHONUNBUFFERED: "1"
    ports:
      - "50051:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully

  simulator:
    build: .
    command: python simulator/tunisian_simulator.py --host grpc:50051
    env_file:
      - .env
    profiles: ["sim"]
    depends_on:
      - grpc

  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_command_center.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env.example
    ports:
      - "8501:8501"
    depends_on:
      - db
      - redis
      - anvil-blockchain

  n8n-boundary:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Africa/Tunis
    ports:
      - "5678:5678"
    volumes:
      - ./workflows:/home/node/.n8n/workflows